name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lexiflow
          POSTGRES_PASSWORD: lexiflow_dev_password
          POSTGRES_DB: lexiflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lexiflow -d lexiflow"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://lexiflow:lexiflow_dev_password@127.0.0.1:5432/lexiflow?schema=public
      JWT_SECRET: ci-test-jwt-secret-with-more-than-32-characters

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies & generate Prisma client
        run: |
          npm ci --prefix server
          npm run db:generate --prefix server

      - name: Run Prisma migrations, seed, build, and tests
        run: |
          npm run db:deploy --prefix server
          npm run db:seed --prefix server
          npm run build --prefix server
          npm test --prefix server

      - name: Install frontend dependencies and build production bundle
        run: |
          npm ci --prefix client
          npm run build --prefix client
