# LexiFlow 生产环境 Nginx 配置模板
# 使用前请将 example.com 和 www.example.com 替换为你的真实域名
# 放置路径（Ubuntu/Debian）：/etc/nginx/sites-available/lexiflow.conf
# 启用命令：sudo ln -s /etc/nginx/sites-available/lexiflow.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # 前端构建产物（vite build 生成的静态文件目录）
    root /var/www/lexiflow/client/dist;
    index index.html;

    # 开启 Gzip 压缩，减小静态资源传输体积
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 基础安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 带 hash 的构建资源设置长效缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端 API 反向代理 -> PM2 守护的 Express 服务（仅监听本机 4000 端口）
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # React 单页应用（SPA）路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
