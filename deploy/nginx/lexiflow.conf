# Production Nginx configuration template for LexiFlow
# Replace example.com and www.example.com with your domain before enabling.
# Target path on Ubuntu/Debian: /etc/nginx/sites-available/lexiflow.conf

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Built frontend static assets (generated by vite build)
    root /var/www/lexiflow/client/dist;
    index index.html;

    # Gzip compression for text-based responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Basic security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Immutable long-term cache for hashed bundle assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse proxy /api/* requests to the PM2-managed Express server on localhost:4000
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # React SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
