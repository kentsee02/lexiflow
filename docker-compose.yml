services:
  db:
    image: postgres:16-alpine
    container_name: lexiflow-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lexiflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexiflow_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lexiflow}
    volumes:
      - lexiflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexiflow} -d ${POSTGRES_DB:-lexiflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lexiflow_pgdata:
